<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFix</title>
</head>

<body>

  <h1>CampusFix</h1>
  <p>Report. Connect. Solve.</p>

  <p>
    Report campus problems such as network issues and power outages.
  </p>

  <button onclick="showForm('Network Problem')">
    Network Problem
  </button>

  <button onclick="showForm('Power Problem')">
    Power Problem
  </button>

  <div id="formSection" style="display:none;">
    <h2 id="formTitle"></h2>

    <form id="reportForm">

      <input
        type="text"
        id="location"
        placeholder="Enter location"
        required
      >

      <br><br>

      <textarea
        id="description"
        placeholder="Describe the problem"
        required
      ></textarea>

      <br><br>

      <input
        type="tel"
        id="phone"
        placeholder="Phone number"
      >

      <br><br>

      <button type="submit">
        Submit Report
      </button>

    </form>
  </div>

  <script>
    let selectedProblem = "";

    function showForm(problem) {
      selectedProblem = problem;

      document.getElementById("formSection").style.display = "block";
      document.getElementById("formTitle").textContent =
        "Report: " + problem;
    }

    document.getElementById("reportForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const report = {
        problem: selectedProblem,
        location: document.getElementById("location").value,
        description: document.getElementById("description").value,
        phone: document.getElementById("phone").value
      };

      try {
        const response = await fetch("/api/reports", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(report)
        });

        const data = await response.json();

        if (data.success) {
          alert("Report submitted successfully!");

          document.getElementById("reportForm").reset();
        } else {
          alert(data.error || "Something went wrong.");
        }

      } catch (error) {
        alert("Unable to submit report.");
      }
    });
  </script>

</body>
</html>
