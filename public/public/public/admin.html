<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFix Dashboard</title>
</head>
<body>

  <h1>CampusFix Admin Dashboard</h1>

  <button onclick="logout()">Logout</button>

  <hr>

  <h2>Reports</h2>

  <table border="1" cellpadding="10">
    <thead>
      <tr>
        <th>ID</th>
        <th>Problem</th>
        <th>Location</th>
        <th>Description</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="reportsTable"></tbody>
  </table>

  <script>
    async function loadReports() {

      const response = await fetch("/api/reports");

      if (response.status === 401) {
        window.location.href = "/admin-login.html";
        return;
      }

      const reports = await response.json();

      const table = document.getElementById("reportsTable");

      table.innerHTML = "";

      reports.forEach(report => {

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${report.id}</td>
          <td>${report.problem}</td>
          <td>${report.location}</td>
          <td>${report.description}</td>
          <td>${report.phone || "-"}</td>

          <td>
            <select onchange="updateStatus(${report.id}, this.value)">
              <option value="Pending" ${report.status === "Pending" ? "selected" : ""}>
                Pending
              </option>

              <option value="In Progress" ${report.status === "In Progress" ? "selected" : ""}>
                In Progress
              </option>

              <option value="Resolved" ${report.status === "Resolved" ? "selected" : ""}>
                Resolved
              </option>
            </select>
          </td>

          <td>${report.status}</td>
        `;

        table.appendChild(row);

      });
    }

    async function updateStatus(id, status) {

      const response = await fetch(`/api/reports/${id}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status })
      });

      const data = await response.json();

      if (data.success) {

        alert("Status updated successfully.");

        loadReports();

      } else {

        alert(data.error || "Failed to update status.");

      }
    }

    async function logout() {

      await fetch("/api/admin/logout", {
        method: "POST"
      });

      window.location.href = "/admin-login.html";
    }

    loadReports();
  </script>

</body>
</html>
